<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">

<div class="card">
  <h1>Dashboard วิเคราะห์ผู้เรียน</h1>
</div>

<div class="stats-grid">

<div class="stat-card">
  <div class="stat-number" id="totalStudents">0</div>
  <div class="stat-label">นักเรียนทั้งหมด</div>
</div>

<div class="stat-card">
  <div class="stat-number" id="riskStudents">0</div>
  <div class="stat-label">กลุ่มเสี่ยง</div>
</div>

<div class="stat-card">
  <div class="stat-number" id="depressionStudents">0</div>
  <div class="stat-label">เสี่ยงซึมเศร้า</div>
</div>

<div class="stat-card">
  <div class="stat-number" id="suicideStudents">0</div>
  <div class="stat-label">Suicide Risk</div>
</div>

</div>

<div class="card">
  <canvas id="riskChart"></canvas>
</div>

<div class="card">
  <button onclick="exportCSV()">Export CSV</button>
  <button onclick="exportPDF()">Export PDF</button>
</div>

<div class="card">

<table>
<thead>
<tr>
  <th>ชื่อ</th>
  <th>ห้อง</th>
  <th>AI Risk</th>
  <th>Dropout</th>
  <th>PHQ-9</th>
  <th>Alert</th>
</tr>
</thead>
<tbody id="studentTable"></tbody>
</table>

</div>

</div>

<script src="js/dashboard.js"></script>

</body>
</html>
