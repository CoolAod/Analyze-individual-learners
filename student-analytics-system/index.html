<!DOCTYPE html>
  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

</head>
<body>

<div class="container">

<div class="card">
  <h1>ระบบวิเคราะห์ผู้เรียนรายบุคคล</h1>
  <p>Student Analytics System + PHQ-9 + AI Analytics</p>
</div>

<form id="studentForm">

<div class="card">
  <h2>ข้อมูลพื้นฐาน</h2>

  <div class="field">
    <label>ชื่อ-สกุล</label>
    <input type="text" id="fullname" required>
  </div>

  <div class="field">
    <label>ห้องเรียน</label>
    <input type="text" id="classroom" required>
  </div>

  <div class="field">
    <label>เบอร์โทรศัพท์</label>
    <input type="tel" id="phone" required>
  </div>

  <div class="field">
    <label>GPA</label>
    <input type="number" step="0.01" id="gpa">
  </div>

  <div class="field">
    <label>รายได้ครอบครัว</label>
    <select id="income">
      <option value="">เลือก</option>
      <option value="ต่ำ">ต่ำกว่า 10,000</option>
      <option value="กลาง">10,000 - 30,000</option>
      <option value="สูง">มากกว่า 30,000</option>
    </select>
  </div>
</div>

<div class="card">

<h2>แบบประเมิน PHQ-9</h2>

<div id="questions"></div>

</div>

<div class="card">
  <button type="submit">บันทึกข้อมูล</button>
  <button type="button" onclick="openDashboard()">Dashboard</button>
</div>

</form>

</div>

<script src="js/firebase.js"></script>
<script src="js/ai.js"></script>
<script src="js/sheets.js"></script>
<script src="js/app.js"></script>

</body>
</html>
